<!-- Navbar Start -->
<nav class="navbar navbar-expand bg-light navbar-light sticky-top px-4 py-0">

  <!-- LOGO (mobile) -->
  <a routerLink="/dashboard" class="navbar-brand d-flex d-lg-none me-4">
    <h2 class="text-primary mb-0">
      <i class="fa fa-hashtag"></i>
    </h2>
  </a>

  <!-- ☰ Sidebar Toggle -->
  <a href="#" class="sidebar-toggler flex-shrink-0" (click)="onToggle($event)">
    <i class="fa fa-bars"></i>
  </a>

  <!-- 🔍 Search -->
  <form class="d-none d-md-flex ms-4">
    <input class="form-control border-0" type="search" placeholder="Search...">
  </form>

  <!-- RIGHT SIDE -->
  <div class="navbar-nav align-items-center ms-auto">

    <!-- 📩 MESSAGES -->
    <div class="nav-item dropdown">
      <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown">
        <i class="fa fa-envelope me-lg-2"></i>
        <span class="d-none d-lg-inline-flex">Messages</span>
      </a>

      <div class="dropdown-menu dropdown-menu-end bg-light border-0 rounded-0 rounded-bottom m-0">

        <div class="dropdown-item" *ngFor="let msg of messages">
          <div class="d-flex align-items-center">
            <img class="rounded-circle"
                 [src]="msg.image"
                 style="width: 40px; height: 40px;">
            <div class="ms-2">
              <h6 class="fw-normal mb-0">{{ msg.title }}</h6>
              <small>{{ msg.time }}</small>
            </div>
          </div>
        </div>

        <hr class="dropdown-divider">
        <a class="dropdown-item text-center">See all messages</a>

      </div>
    </div>

    <!-- 🔔 NOTIFICATIONS -->
    <div class="nav-item dropdown">
      <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown">
        <i class="fa fa-bell me-lg-2"></i>
        <span class="d-none d-lg-inline-flex">Notifications</span>
      </a>

      <div class="dropdown-menu dropdown-menu-end bg-light border-0 rounded-0 rounded-bottom m-0">

        <div class="dropdown-item" *ngFor="let notif of notifications">
          <h6 class="fw-normal mb-0">{{ notif.title }}</h6>
          <small>{{ notif.time }}</small>
        </div>

        <hr class="dropdown-divider">
        <a class="dropdown-item text-center">See all notifications</a>

      </div>
    </div>

    <!-- 👤 USER -->
    <div class="nav-item dropdown">
      <a href="#" class="nav-link dropdown-toggle d-flex align-items-center" data-bs-toggle="dropdown">
        <img class="rounded-circle me-lg-2"
             [src]="user.image"
             style="width: 40px; height: 40px;">
        <span class="d-none d-lg-inline-flex">{{ user.name }}</span>
      </a>

      <div class="dropdown-menu dropdown-menu-end bg-light border-0 rounded-0 rounded-bottom m-0">
        <a class="dropdown-item" (click)="goToProfile()">Profile</a>
        <a class="dropdown-item" (click)="goToSettings()">Paramètres</a>
        <a class="dropdown-item" (click)="logout()">Déconnexion</a>
      </div>
    </div>

  </div>

</nav>
<!-- Navbar End -->
