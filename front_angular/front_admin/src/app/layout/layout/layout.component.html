<div class="container-fluid position-relative bg-white p-0">

  <app-sidebar
    [isSidebarOpen]="isSidebarOpen">
  </app-sidebar>

  <div class="overlay"
       *ngIf="isSidebarOpen && isMobile()"
       (click)="toggleSidebar()">
  </div>

  <div class="content" [class.full]="!isSidebarOpen">

    <app-navbar (toggle)="toggleSidebar()"></app-navbar>

    <router-outlet></router-outlet>

  </div>

</div>
