<div class="product-details" *ngIf="product">

    <div class="product-container">

        <!-- images -->

        <div class="images">

            <img class="main-img" [src]="selectedImage">

            <div class="thumbs">

                <img *ngFor="let img of product.image" [src]="img" (click)="selectImage(img)">

            </div>

        </div>


        <!-- info -->

        <div class="info">

            <h2>{{product.name}}</h2>

            <p class="price">
                {{product.price}} $
            </p>
            <p>
                <span *ngIf="product.badge === 'sale'" class="old-price">{{product.oldPrice}} $</span>
            </p>
            <p class="description">
                {{product.description}}
            </p>


            <!-- wishlist -->

            <div class="wishlist-wrapper">
  <input type="checkbox" id="favorite" [checked]="wishlist" (change)="toggleWishlist()">
  <label for="favorite" class="container">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
      fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round" class="feather feather-heart">
      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
    </svg>
    <div class="action">
      <span class="option-1">Add to Favorites</span>
      <span class="option-2">Added to Favorites</span>
    </div>
  </label>
</div>


            <!-- quantity -->

            <div class="quantity">

                <button (click)="decrease()">-</button>

                <span>{{quantity}}</span>

                <button (click)="increase()">+</button>

            </div>


            <!-- add to cart -->

            <button class="add-cart">
                Add to Cart
            </button>

        </div>

    </div>

</div>



<!-- Related Products -->

<h3 class="related-title">Related Products</h3>

<div class="related-grid">

    <div class="related-card" *ngFor="let p of relatedProducts">
        <a [routerLink]="['/product-details', p.id]"><img [src]="getImage(p)" alt="{{p.name}}"></a>

        <h4>{{p.name}}</h4>

        <p>{{p.price}} $</p>

    </div>

</div>
